<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
</head>

<body>
    <main class="container">
        <nav>
            <ul>
                <li><a href="/runs.html">Runs</a></li>
                <li><a href="/profile.html">Profile</a></li>
                <li><a href="#" id="logout-link">Logout</a></li>
            </ul>
        </nav>
        <h1>Dashboard</h1>
        <section>
            <h2>Totals</h2>
            <p>Total distance: <span id="total-distance"></span> meters</p>
            <p>Total runs: <span id="total-runs"></span></p>
        </section>
        <h2>Average pace by category</h2>
        <table id="average_pace">
            <thead>
                <tr>
                    <th>Distance category</th>
                    <th>Average Pace (s/km)</th>
                </tr>
            </thead>
            <tbody>

            </tbody>
        </table>
        <h2>Personal records</h2>
        <table id="personal_records">
            <thead>
                <tr>
                    <th>Distance</th>
                    <th>Time (s)</th>
                </tr>
            </thead>
            <tbody>
                
            </tbody>
        </table>
        <p id="error-message" hidden></p>
    </main>
    <script src="api.js"></script>
    <script>
        requireAuth();

        document.getElementById("logout-link").addEventListener("click", async (event) => {
            event.preventDefault();
            try {
                await apiRequest("POST", "/auth/logout");
                window.location.href = "/login.html";
            } catch (err) {
                showError(err);
            }
        });

        async function loadDashboard() {
            try {
                const data = await apiRequest('GET', '/dashboard');
                const total_distance = document.getElementById('total-distance');
                const total_runs = document.getElementById('total-runs');
                total_distance.textContent = data.total_distance_meters;
                total_runs.textContent = data.run_count;
                const pace_tbody = document.querySelector("#average_pace tbody");
                const personal_record_tbody = document.querySelector("#personal_records tbody");
                pace_tbody.innerHTML = "";
                personal_record_tbody.innerHTML = "";
                for (const [category, average_pace] of Object.entries(data.average_pace_by_category)) { //Can't interate through an object alone
                    const row = document.createElement("tr");
                    row.innerHTML = `<td>${category}</td><td>${average_pace ?? "N/A"}</td>`; //Falls back onto N/A if pace is null
                    pace_tbody.appendChild(row);
                }
                for (const record of data.personal_records) {
                    const row = document.createElement("tr");
                    row.innerHTML = `<td>${record.distance_category}</td><td>${record.duration_seconds}</td>`;
                    personal_record_tbody.appendChild(row);
                }
            } catch (err) {
                showError(err);
            }      
        }
        loadDashboard()
    </script>
</body>

</html>
